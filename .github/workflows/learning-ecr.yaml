name: Learning - ECR Workflow

on:
  workflow_dispatch:

jobs:
  checkout-and-inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

      - name: Check Docker
        run: |
          docker version
          docker info

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag e2emlops-training:${{ github.sha }} \
            .

      - name: Test Docker image
        shell: bash
        run: |
          IMAGE="e2emlops-training:${{ github.sha }}"

          if ! docker run --rm "$IMAGE" \
            python -c "import torch; print(torch.__version__)"; then
            echo "::error::Docker smoke test failed"
            exit 1
          fi

          echo "Docker smoke test passed"


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity
          aws ecr describe-repositories \
            --repository-names "${{ secrets.ECR_REPOSITORY_NAME }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          LOCAL_IMAGE="e2emlops-training:${IMAGE_TAG}"
          REMOTE_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Local image:"
          docker image inspect "$LOCAL_IMAGE" >/dev/null

          echo "Tagging as $REMOTE_IMAGE"
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"

          echo "Pushing to ECR"
          docker push "$REMOTE_IMAGE"

          echo "Successfully pushed: $REMOTE_IMAGE"
